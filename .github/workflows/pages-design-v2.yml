name: Design-v2 preview note

on:
  push:
    branches: [feature/tb4l-design-v2]
  workflow_dispatch:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Preview is published via main Pages workflow
        run: |
          echo "Live site (main, unchanged): https://aleksandra-mirkanovic.github.io/tb4l-mvp-prototype/#/"
          echo "Design v2 preview: https://aleksandra-mirkanovic.github.io/tb4l-mvp-prototype/design-v2/#/"
          echo "Re-run workflow 'Deploy GitHub Pages' on main after pushing this branch to refresh the preview."
