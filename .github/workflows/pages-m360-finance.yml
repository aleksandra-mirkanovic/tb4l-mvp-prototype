name: Deploy M360&Finance preview

on:
  push:
    branches: ["M360&Finance"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (live site root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout M360&Finance branch
        uses: actions/checkout@v4
        with:
          ref: M360&Finance
          path: m360-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build main site
        working-directory: main-src
        run: |
          npm install
          npm run build
          mkdir -p ../site
          cp -R dist/. ../site/

      - name: Build M360&Finance preview
        working-directory: m360-src
        run: |
          npm install
          npx vite build --base=/tb4l-mvp-prototype/m360-finance/
          mkdir -p ../site/m360-finance
          cp -R dist/. ../site/m360-finance/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
