name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build main → site root (live URL stays on main)
        run: |
          git checkout origin/main
          npm run build
          mkdir -p site
          cp -R dist/. site/

      - name: Build design-v2 → /design-v2/ (if branch exists)
        run: |
          if git rev-parse --verify origin/feature/tb4l-design-v2 >/dev/null 2>&1; then
            git checkout origin/feature/tb4l-design-v2
            npm install
            npx vite build --base /tb4l-mvp-prototype/design-v2/
            mkdir -p site/design-v2
            cp -R dist/. site/design-v2/
            echo "Published design-v2 preview under /design-v2/"
          else
            echo "No feature/tb4l-design-v2 branch — skipping preview"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
